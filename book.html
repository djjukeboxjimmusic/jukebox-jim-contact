<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Book an Event - Jukebox Jim</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Book an Event</h1>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="events.html">Event Services</a>
    <a href="gallery.html">Gallery</a>
    <a href="book.html">Booking</a>
    <a href="contact.vcf">Download Contact</a>
</nav>

<section class="about">
    <h3>Ready to bring unforgettable entertainment to your event?</h3>
    <p>Fill out the form below and I’ll get back to you quickly.</p>

    <form action="https://formsubmit.co/DJ.Jukebox.Jim.Music@gmail.com" method="POST">

        <!-- Protect from spam -->
        <input type="hidden" name="_captcha" value="false">

        <!-- Redirect after submission -->
        <input type="hidden" name="_next" value="https://djjukeboxjimmusic.github.io/jukebox-jim-contact/thankyou.html">

        <label>Your Name</label><br>
        <input type="text" name="name" required><br><br>

        <label>Your Email</label><br>
        <input type="email" name="email" required><br><br>

        <label>Your Phone Number</label><br>
        <input type="text" name="phone" required><br><br>

        <label>Event Type</label><br>
        <input type="text" name="event_type" placeholder="Wedding, Lodge Event, Music Bingo, etc." required><br><br>

        <label>Event Date</label><br>
        <input type="date" name="event_date" required><br><br>

        <label>Message</label><br>
        <textarea name="message" rows="5" required></textarea><br><br>

        <button class="button" type="submit">Send Booking Request</button>
    </form>
</section>

<footer>
